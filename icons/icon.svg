<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5392D"/>
      <stop offset="100%" stop-color="#B32419"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base App Icon Tile with Mondrian Red -->
  <rect width="512" height="512" rx="112" fill="url(#redGrad)"/>

  <!-- Mondrian Geometric Architectural Grid Accents -->
  <rect x="0" y="470" width="512" height="42" fill="#121212" opacity="0.25"/>
  <rect x="470" y="0" width="42" height="512" fill="#121212" opacity="0.15"/>
  <rect x="36" y="36" width="70" height="70" rx="18" fill="#FFFFFF" opacity="0.12"/>
  <rect x="406" y="406" width="70" height="70" rx="18" fill="#FFFFFF" opacity="0.15"/>

  <!-- Glass Inner Highlight -->
  <rect width="512" height="512" rx="112" fill="url(#glassShine)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Core Kanji / Kana Emblem (Hiragana あ & Katakana ア) -->
  <g filter="url(#subtleShadow)">
    <text x="256" y="285" 
          font-family="'Zen Kaku Gothic New', 'Noto Serif JP', 'Hiragino Sans', sans-serif" 
          font-size="180" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          dominant-baseline="central">あ/ア</text>
  </g>

  <!-- Wordmark Tag -->
  <text x="256" y="420" 
        font-family="'Arial', 'Helvetica', sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        opacity="0.95">KANAMASTER</text>
</svg>
